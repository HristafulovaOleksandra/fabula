services:
  postgres:
    image: postgres:17
    container_name: fabula-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: fabula-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  ml-service:
    build: ./ml-service
    image: fabula-ml-service
    container_name: fabula-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./ml-research:/research:ro
      - ${HF_CACHE_DIR:-${USERPROFILE}/.cache/huggingface}:/hf:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build: ./backend
    image: fabula-backend
    container_name: fabula-backend
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SMTP_HOST: ${DOCKER_SMTP_HOST:-mailpit}
      SMTP_PORT: ${DOCKER_SMTP_PORT:-1025}
      ML_SERVICE_URL: http://ml-service:8000
    ports:
      - "5080:5080"
    volumes:
      - ./uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      ml-service:
        condition: service_started

  frontend:
    build: ./frontend
    image: fabula-frontend
    container_name: fabula-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres-data:
